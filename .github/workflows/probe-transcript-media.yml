name: Probe transcript media

on:
  push:
    branches:
      - probe/gpui-transcript-media

permissions:
  contents: read

jobs:
  probe:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        uses: ./.github/actions/install-desktop-deps

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-unknown-linux-gnu
          prefix-key: v1-rust-gpui
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target

      - name: Run setup
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: x86_64-unknown-linux-gnu

      - name: Prepare GPUI dependency
        run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh

      - name: Build cap-gpui
        run: >-
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui
          --config 'profile.dev.package.wgpu-types.debug-assertions=false'

      - name: Drive the editor and record
        run: |
          sudo apt-get install -y -qq xvfb xdotool ffmpeg tesseract-ocr python3-dbus python3-gi dbus >/dev/null
          bash scripts/probe-transcript/probe.sh apps/desktop-gpui/target/debug/cap-gpui \
            target/native-deps/lib "$RUNNER_TEMP/media"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcript-media
          path: ${{ runner.temp }}/media
